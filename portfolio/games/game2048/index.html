<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="小林的响应式 2048 数字合成游戏">
  <meta name="theme-color" content="#f2f6f3">
  <title>2048 数字合成 | 小林的个人网页</title>
  <script src="js/theme_bootstrap.js"></script>
  <link href="style/main.css" rel="stylesheet" type="text/css">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
</head>
<body>
  <a class="back-link" href="../../../index.html#portfolio" aria-label="返回作品集" title="返回作品集">&#8592;</a>

  <main class="app-shell">
    <header class="page-header">
      <div>
        <span class="eyebrow">NUMBER LAB</span>
        <h1>2048</h1>
        <p>数字合成实验</p>
      </div>
      <div class="header-tools">
        <button class="icon-button sound-toggle" type="button" data-sound-toggle aria-label="关闭音效" title="关闭音效">
          <span aria-hidden="true">♪</span>
        </button>
        <button class="icon-button theme-toggle" type="button" data-theme-toggle aria-label="切换到深色模式" title="切换到深色模式">
          <span data-theme-icon aria-hidden="true">◐</span>
        </button>
      </div>
    </header>

    <section class="scoreboard" aria-label="游戏数据">
      <div class="score-item">
        <span>得分</span>
        <strong class="score-container" aria-live="polite">0</strong>
      </div>
      <div class="score-item">
        <span>最高</span>
        <strong class="best-container">0</strong>
      </div>
      <div class="score-item">
        <span>步数</span>
        <strong class="move-container">0</strong>
      </div>
    </section>

    <div class="game-toolbar">
      <span class="target-badge">目标 <strong>2048</strong></span>
      <button class="restart-button" type="button">新游戏</button>
    </div>

    <section class="game-container" aria-label="2048 游戏棋盘">
      <div class="game-message" role="status" aria-live="polite">
        <p></p>
        <div class="message-actions">
          <button class="keep-playing-button" type="button">继续挑战</button>
          <button class="retry-button" type="button">再来一局</button>
        </div>
      </div>

      <div class="grid-container" aria-hidden="true">
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
      </div>
      <div class="tile-container"></div>
    </section>

    <nav class="direction-pad" aria-label="移动方向">
      <button type="button" data-direction="0" aria-label="向上" title="向上">&#8593;</button>
      <button type="button" data-direction="3" aria-label="向左" title="向左">&#8592;</button>
      <button type="button" data-direction="2" aria-label="向下" title="向下">&#8595;</button>
      <button type="button" data-direction="1" aria-label="向右" title="向右">&#8594;</button>
    </nav>

    <footer class="game-footer">
      <span>基于 Gabriele Cirulli 的开源项目改造</span>
      <span><a href="https://github.com/gabrielecirulli/2048" target="_blank" rel="noopener noreferrer">源代码</a> · <a href="LICENSE.txt">MIT License</a></span>
    </footer>
  </main>

  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/enhancements.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
