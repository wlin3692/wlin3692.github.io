<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模糊加载</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>BLUR LOAD / 041</span><b>STATE TRANSITION</b></header><main class="micro-main"><p class="micro-eyebrow">LOADING / PERCEPTION</p><h1>等待的时候，<br><em>也可以有节奏。</em></h1><p class="micro-lead">点击重新加载，观察占位内容从模糊到清晰的过渡。</p><section class="micro-panel micro-center"><div id="skeleton" style="height:200px;padding:35px;text-align:left;background:linear-gradient(110deg,#d8e1da,#fff,#d8e1da);background-size:200% 100%;filter:blur(8px);transition:filter .5s"><h2>正在整理内容</h2><p>一段内容即将出现……</p></div><button class="micro-button" id="load" style="margin-top:20px">加载内容</button><p id="state" class="micro-note">内容尚未准备好</p></section></main><footer class="micro-footer"><span>基于 Blurry Loading · MIT License</span><span>状态动画</span></footer><script>let loaded=false;load.onclick=()=>{loaded=!loaded;skeleton.style.filter=loaded?'blur(0)':'blur(8px)';skeleton.style.background=loaded?'#fff':'linear-gradient(110deg,#d8e1da,#fff,#d8e1da)';load.textContent=loaded?'重新加载':'加载内容';state.textContent=loaded?'内容已清晰呈现':'内容尚未准备好'};</script></body></html>
