<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>密钥生成器</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>PASSWORD LAB / 017</span><b>LOCAL TOOL</b></header><main class="micro-main"><p class="micro-eyebrow">UTILITY / RANDOMNESS</p><h1>生成一枚<br><em>可靠密钥。</em></h1><p class="micro-lead">用浏览器本地随机源创建临时密钥，不上传、不保存，复制后即可使用。</p><section class="micro-panel"><h2 id="out">点击生成</h2><div class="micro-row"><label>长度 <input id="len" class="micro-input" type="number" min="8" max="40" value="18"></label><button class="micro-button" id="gen">生成密钥</button><button class="micro-button secondary" id="copy">复制</button></div><div class="micro-stat"><div><b id="strength">-</b><span>强度</span></div><div><b id="chars">-</b><span>字符数</span></div><div><b id="pool">-</b><span>字符池</span></div></div></section></main><footer class="micro-footer"><span>基于 Password Generator · MIT License</span><span>仅在本机生成</span></footer><script>const out=document.querySelector('#out'),len=document.querySelector('#len'),strength=document.querySelector('#strength'),chars=document.querySelector('#chars'),pool=document.querySelector('#pool');const sets=['ABCDEFGHJKLMNPQRSTUVWXYZ','abcdefghijkmnopqrstuvwxyz','23456789','!@#$%&*?'];function gen(){let n=Math.max(8,Math.min(40,+len.value||18)),s='';for(let i=0;i<n;i++){const set=sets[i%sets.length];s+=set[Math.floor(Math.random()*set.length)]}out.textContent=s;chars.textContent=n;pool.textContent=sets.length;strength.textContent=n>=24?'高':n>=14?'中':'低'}document.querySelector('#gen').onclick=gen;document.querySelector('#copy').onclick=()=>navigator.clipboard?.writeText(out.textContent);gen();</script></body></html>
