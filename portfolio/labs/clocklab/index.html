<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主题时钟</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>CLOCK LAB / 052</span><b>TIME / THEME</b></header><main class="micro-main micro-center"><p class="micro-eyebrow">TIME / AMBIENCE</p><h1>现在几点，<br><em>决定今天的色温。</em></h1><p class="micro-lead" style="margin-left:auto;margin-right:auto">观察本地时间，并根据时段切换页面配色。</p><section class="micro-panel"><div class="micro-big micro-timer" id="clock">00:00:00</div><div class="micro-result" id="mood">准备读取时间</div></section></main><footer class="micro-footer"><span>基于 Theme Clock · MIT License</span><span>本地时间</span></footer><script>function tick(){const d=new Date(),h=d.getHours();clock.textContent=[h,d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':');const morning=h>=6&&h<12;const evening=h>=18;mood.textContent=morning?'晨光模式 · 适合启动':evening?'夜航模式 · 适合收尾':'工作模式 · 适合专注';document.body.style.background=morning?'#eef0d9':evening?'#cbdce8':'#f1f0eb'}setInterval(tick,1000);tick();</script></body></html>
