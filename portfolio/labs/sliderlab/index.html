<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>触感滑台</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>SLIDER LAB / 022</span><b>TOUCH READY</b></header><main class="micro-main"><p class="micro-eyebrow">GESTURE / POSITION</p><h1>拖动一条线，<br><em>改变现场。</em></h1><p class="micro-lead">把一个最基础的滑杆做成可观察的空间：位置、角度和颜色都会即时响应。</p><section class="micro-panel"><h2>现场参数</h2><input id="range" class="micro-range" type="range" min="0" max="100" value="50"><div id="scene" style="height:220px;margin-top:24px;display:grid;place-items:center;background:linear-gradient(120deg,#d9eee0,#eef0cf);transition:background .2s"><div id="orb" style="width:100px;height:100px;border-radius:50%;background:#2f7060;transition:transform .2s"></div></div><div class="micro-stat"><div><b id="value">50%</b><span>位置</span></div><div><b id="angle">0°</b><span>旋转</span></div><div><b id="color">#2f7060</b><span>主色</span></div></div></section></main><footer class="micro-footer"><span>基于 Touch Slider · MIT License</span><span>鼠标与触控</span></footer><script>const range=document.querySelector('#range'),orb=document.querySelector('#orb'),scene=document.querySelector('#scene');function draw(){const v=+range.value;value.textContent=v+'%';angle.textContent=(v*3.6-180).toFixed(0)+'°';const hue=120+v;const colorValue=`hsl(${hue} 35% 35%)`;color.textContent=colorValue;orb.style.background=colorValue;orb.style.transform=`translateX(${(v-50)*3}px) rotate(${v*3.6}deg) scale(${.7+v/150})`;scene.style.background=`linear-gradient(${110+v}deg,hsl(${hue} 35% 88%),hsl(${hue+35} 40% 91%))`}range.oninput=draw;draw();</script></body></html>
