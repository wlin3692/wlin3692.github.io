<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>呼吸节奏</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>RELAX LAB / 027</span><b>4-4-6 BREATH</b></header><main class="micro-main micro-center"><p class="micro-eyebrow">PAUSE / BREATHE / RESET</p><h1>给身体<br><em>四分钟安静。</em></h1><p class="micro-lead" style="margin-left:auto;margin-right:auto">跟随圆环的大小呼吸：吸气 4 秒，停留 4 秒，呼气 6 秒。</p><section class="micro-panel"><div id="orb" style="width:150px;height:150px;margin:20px auto;border-radius:50%;display:grid;place-items:center;color:#1e2827;background:#bcecc8;box-shadow:0 0 0 20px rgba(188,236,200,.25);transition:transform 1s ease">准备</div><div class="micro-big micro-timer" id="timer">00:00</div><p id="phase" class="micro-note">点击开始一轮呼吸</p><button id="start" class="micro-button">开始</button></section></main><footer class="micro-footer"><span>基于 Relaxer App · MIT License</span><span>请在舒适状态下使用</span></footer><script>const orb=document.querySelector('#orb'),phase=document.querySelector('#phase'),timer=document.querySelector('#timer'),start=document.querySelector('#start');let run=false,seconds=0,t;const phases=[['吸气',4,1.35],['停留',4,1.35],['呼气',6,.78]];function tick(){seconds++;timer.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;const cycle=seconds%14;let cursor=cycle<4?0:cycle<8?1:2;phase.textContent=phases[cursor][0];orb.textContent=phases[cursor][0];orb.style.transform=`scale(${phases[cursor][2]})`}start.onclick=()=>{run=!run;start.textContent=run?'暂停':'继续';if(run){t=setInterval(tick,1000);tick()}else clearInterval(t)};</script></body></html>
