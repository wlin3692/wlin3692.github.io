<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加载器工坊</title><link rel="stylesheet" href="../site/microlabs.css"><style>.loader{width:70px;height:70px;margin:35px auto;border:5px solid #d9eee0;border-top-color:#2f7060;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>LOADER LAB / 055</span><b>WAITING STATE</b></header><main class="micro-main micro-center"><p class="micro-eyebrow">LOADING / PATIENCE</p><h1>等待不是空白，<br><em>它有自己的节奏。</em></h1><p class="micro-lead" style="margin-left:auto;margin-right:auto">切换三种加载状态，观察不同反馈如何影响等待感受。</p><section class="micro-panel"><div id="loader" class="loader"></div><div class="micro-row" style="justify-content:center"><button class="micro-button" data-state="加载中">旋转</button><button class="micro-button secondary" data-state="同步中">同步</button><button class="micro-button secondary" data-state="完成">完成</button></div><p class="micro-note" id="state">加载中</p></section></main><footer class="micro-footer"><span>基于 Kinetic Loader · MIT License</span><span>状态视觉</span></footer><script>document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state.textContent=b.dataset.state;loader.style.animationPlayState=b.dataset.state==='完成'?'paused':'running';loader.style.borderTopColor=b.dataset.state==='完成'?'#7a9b7e':'#2f7060'})</script></body></html>
