<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顺序整理器</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>SORT LAB / 028</span><b>REORDER</b></header><main class="micro-main"><p class="micro-eyebrow">LIST / PRIORITY</p><h1>给想法排个<br><em>先后顺序。</em></h1><p class="micro-lead">用上移、下移按钮整理一组工作步骤。适合做小型流程和今日计划。</p><section class="micro-panel"><ul class="micro-list" id="list"></ul><button class="micro-button secondary" id="shuffle" style="margin-top:18px">重新打乱</button></section></main><footer class="micro-footer"><span>基于 Sortable List · MIT License</span><span>键盘与触控皆可</span></footer><script>const list=document.querySelector('#list');let items=['收集参考','拆分问题','做一个草稿','邀请反馈','整理发布'];function render(){list.innerHTML=items.map((x,i)=>`<li><b>0${i+1}</b>　${x}<button data-down="${i}" ${i===items.length-1?'disabled':''}>下移</button><button data-up="${i}" ${i===0?'disabled':''}>上移</button></li>`).join('')}list.onclick=e=>{const up=e.target.dataset.up,down=e.target.dataset.down;if(up!==undefined){[items[up-1],items[up]]=[items[up],items[up-1]];render()}if(down!==undefined){[items[down],items[+down+1]]=[items[+down+1],items[down]];render()}};shuffle.onclick=()=>{items.sort(()=>Math.random()-.5);render()};render();</script></body></html>
