<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字猜谜</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>GUESS LAB / 029</span><b>1 — 100</b></header><main class="micro-main"><p class="micro-eyebrow">GAME / LOGIC</p><h1>猜一个数字，<br><em>听提示靠近它。</em></h1><p class="micro-lead">系统已经选好 1 到 100 的数字。你有 8 次机会，用线索逼近答案。</p><section class="micro-panel"><div class="micro-row"><input id="guess" class="micro-input" type="number" min="1" max="100" placeholder="输入 1-100"><button id="tryButton" class="micro-button">提交猜测</button></div><div class="micro-result" id="message">开始后会看到提示</div><p class="micro-note" id="tries">剩余 8 次</p><button id="again" class="micro-button secondary">换一个数字</button></section></main><footer class="micro-footer"><span>基于 Number Guessing Game · MIT License</span><span>逻辑小游戏</span></footer><script>let answer=Math.floor(Math.random()*100)+1,left=8;const guess=document.querySelector('#guess'),message=document.querySelector('#message'),tries=document.querySelector('#tries'),tryButton=document.querySelector('#tryButton'),again=document.querySelector('#again');tryButton.onclick=()=>{const n=+guess.value;if(n<1||n>100)return;left--;message.textContent=n===answer?'猜中了！你找到隐藏数字。':n<answer?'再大一点。':'再小一点。';tries.textContent=`剩余 ${left} 次`;if(n===answer||left===0)tryButton.disabled=true};again.onclick=()=>{answer=Math.floor(Math.random()*100)+1;left=8;tryButton.disabled=false;message.textContent='开始后会看到提示';tries.textContent='剩余 8 次';guess.value=''};</script></body></html>
