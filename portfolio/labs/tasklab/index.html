<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻量任务板</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>TASK LAB / 020</span><b>LOCAL BOARD</b></header><main class="micro-main"><p class="micro-eyebrow">PLAN / FINISH / REVIEW</p><h1>今天只做<br><em>下一件事。</em></h1><p class="micro-lead">把任务放到一个足够简单的清单里，完成它，然后看见进度。</p><section class="micro-panel"><div class="micro-row"><input id="task" class="micro-input" placeholder="添加一个小任务"><button id="add" class="micro-button">加入清单</button></div><ul id="list" class="micro-list"></ul><div class="micro-stat"><div><b id="all">0</b><span>全部</span></div><div><b id="done">0</b><span>完成</span></div><div><b id="left">0</b><span>待办</span></div></div></section></main><footer class="micro-footer"><span>基于 Todo List · MIT License</span><span>本地保存</span></footer><script>const input=document.querySelector('#task'),list=document.querySelector('#list');let data=JSON.parse(localStorage.getItem('lin-tasks')||'[]');function render(){list.innerHTML=data.map((t,i)=>`<li><label><input type="checkbox" data-done="${i}" ${t.done?'checked':''}> ${t.text}</label><button data-del="${i}">删除</button></li>`).join('');all.textContent=data.length;done.textContent=data.filter(t=>t.done).length;left.textContent=data.filter(t=>!t.done).length;localStorage.setItem('lin-tasks',JSON.stringify(data))}add.onclick=()=>{if(input.value.trim()){data.push({text:input.value.trim(),done:false});input.value='';render()}};list.onclick=e=>{if(e.target.dataset.done){data[+e.target.dataset.done].done=e.target.checked;render()}if(e.target.dataset.del){data.splice(+e.target.dataset.del,1);render()}};input.onkeydown=e=>{if(e.key==='Enter')add.click()};render();</script></body></html>
