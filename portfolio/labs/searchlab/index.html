<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隐藏搜索</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>SEARCH LAB / 040</span><b>FOCUS SEARCH</b></header><main class="micro-main"><p class="micro-eyebrow">DISCOVER / FILTER</p><h1>藏起来的搜索，<br><em>需要时再出现。</em></h1><p class="micro-lead">点击按钮展开搜索框，输入关键词即时过滤本页的作品词条。</p><section class="micro-panel"><div class="micro-row"><button id="open" class="micro-button">打开搜索</button><input id="query" class="micro-input" placeholder="搜索互动、游戏、工具" hidden></div><ul id="list" class="micro-list"><li data-text="粒子实验室 互动">粒子实验室 <small>互动</small></li><li data-text="观影座位规划 工具">观影座位规划 <small>工具</small></li><li data-text="记忆翻牌 游戏">记忆翻牌 <small>游戏</small></li><li data-text="专注播放台 音频">专注播放台 <small>音频</small></li></ul></section></main><footer class="micro-footer"><span>基于 Hidden Search Widget · MIT License</span><span>即时过滤</span></footer><script>const query=document.querySelector('#query');open.onclick=()=>{query.hidden=!query.hidden;open.textContent=query.hidden?'打开搜索':'收起搜索';if(!query.hidden)query.focus()};query.oninput=()=>document.querySelectorAll('#list li').forEach(x=>x.hidden=!x.dataset.text.includes(query.value.trim()));</script></body></html>
