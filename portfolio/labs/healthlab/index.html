<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>状态面板</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>HEALTH LAB / 030</span><b>PRIVATE DASHBOARD</b></header><main class="micro-main"><p class="micro-eyebrow">CHECK IN / GENTLE DATA</p><h1>今天的身体，<br><em>发来什么信号？</em></h1><p class="micro-lead">用几个轻量数据做一次自我记录，不追求完美，只观察变化。</p><section class="micro-panel"><h2>基础体态估算</h2><div class="micro-row"><input id="height" class="micro-input" type="number" placeholder="身高 cm"><input id="weight" class="micro-input" type="number" placeholder="体重 kg"><button id="calc" class="micro-button">计算</button></div><div id="result" class="micro-result">输入数据后查看估算</div><div class="micro-stat"><div><b id="water">-</b><span>建议饮水 ml</span></div><div><b id="steps">-</b><span>今日步数目标</span></div><div><b id="sleep">7.5h</b><span>建议睡眠</span></div></div></section></main><footer class="micro-footer"><span>基于 Health Dashboard · MIT License</span><span>非医疗建议</span></footer><script>calc.onclick=()=>{const h=+height.value/100,w=+weight.value;if(!h||!w)return;const bmi=w/(h*h);result.textContent=`估算 BMI：${bmi.toFixed(1)} · ${bmi<18.5?'偏轻':bmi<24?'适中':bmi<28?'偏高':'较高'}（仅作自我观察）`;water.textContent=Math.round(w*35);steps.textContent=bmi>24?'9000':'7500'};</script></body></html>
