<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>❤用爱滋养我们的爱心树❤爱你呦❤</title>
    <link rel="stylesheet" href="../common.css">
    <link type="text/css" rel="stylesheet" href="./renxi/default.css">
    <script type="text/javascript" src="./renxi/jquery.min.js"></script>
    <script type="text/javascript" src="./renxi/jscex.min.js"></script>
    <script type="text/javascript" src="./renxi/jscex-parser.js"></script>
    <script type="text/javascript" src="./renxi/jscex-jit.js"></script>

    <script type="text/javascript" src="./renxi/jscex-async-powerpack.min.js"></script>
    <script type="text/javascript" src="./renxi/functions.js" charset="utf-8"></script>
    <script type="text/javascript" src="./renxi/love.js" charset="utf-8"></script>

    <!-- 粉色飘落枫叶 -->
    <style>
        /* 枫叶初始状态：隐藏 */
        /* 持续飘落的枫叶（来自 index.html） */
        .maple {
            position: fixed;
            top: -60px;          /* 从屏幕外开始 */
            color: #ff0000;      /* emoji 颜色 */
            pointer-events: none;
            z-index: 0;
        }
        .maplebg {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        #main { position: relative; z-index: 1; }
    </style>
  <link rel="stylesheet" href="../../../../personal/site/lab-shell.css">
</head>

<body>
    <!-- 持续飘落的枫叶背景容器 -->
    <div class="maplebg"></div>

    <audio id="bgm" loop preload="metadata" aria-label="背景音乐">
        <source src="zzz.mp3" type="audio/mpeg">
    </audio>
    <div id="bgmControls" role="group" aria-label="背景音乐控制">
        <button id="bgmToggle" type="button" aria-label="播放音乐" title="播放音乐"><span aria-hidden="true">&#9654;</span></button>
        <span id="bgmStatus" class="sr-only" role="status" aria-live="polite">已暂停</span>
    </div>
    <div id="main">
        <div id="error">本页面采用HTML5编辑，目前您的浏览器无法显示，请换成谷歌(<a href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a>)或者火狐(<a href="http://firefox.com.cn/download/">Firefox</a>)浏览器，或者其他游览器的最新版本。</div>
        <div id="wrap">
            <div id="text">
                <div id="code">
                    <font color="black" size="4"><b><i>
                    <span class="say">亲爱的老大！😘</span><br>
                    <span class="say"> </span><br>
                    <span class="say"><span class="ai" >跟你👫 </span>在一起的每个日常🌍</span><br>
                    <span class="say"> </span><br>
                    <span class="say"> 都藏着细碎的温柔💗</span><br>
                    <span class="say"> </span><br>
                    <span class="say">早安是你🌞</span><br>
                    <span class="say"> </span><br>
                    <span class="say">晚安是你🌙</span><br>
                    <span class="say"> </span><br>
                    <span class="say">心里暖暖的牵挂💌，也全是你😋</span><br>

                    <span class="say"> </span><br>
                    <span class="say">                             -- 爱你的🐷</span>
                    </i></b></font>
                </div>
            </div>
            <div id="clock-box">
                <span><font color="#666666"><span class="ai" >🐷和👩 </span>，在一起💕的</font></span>
                <div id="clock"></div>
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
        </div>
    </div>

    <!-- 粉色飘落枫叶生成 -->
    <script>
        // 枫叶 SVG，可直接当背景图，省外部文件
        /* 点一次画布就触发 */
        /* ===== 持续飘落 🍁 功能（来自 index.html） ===== */
        var d = "<div class='maple'>🍁</div>";   // 注意把 <div> 闭合写全
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!reduceMotion) setInterval(function () {
            var f = window.innerWidth;
            var e = Math.random() * (f + 100) - 50; // 横向初始位置
            var o = 0.2 + Math.random();       // 透明度
            var fon = 25 + Math.random() * 50; // 大小
            var l = e - 100 + 200 * Math.random(); // 横向漂移
            var k = 8000 + 5000 * Math.random();   // 下落时间
            var deg = Math.random() * 360;         // 旋转
            $(d).clone().appendTo(".maplebg").css({
                left: e + "px",
                opacity: o,
                transform: "rotate(" + deg + "deg)",
                "font-size": fon
            }).animate({
                top: (window.innerHeight + 80) + "px",
                left: l + "px",
                opacity: 0.1
            }, k, "linear", function () {
                $(this).remove();
            });
        }, 900);
    </script>

    <script>
        (function() {
            var canvas = $('#canvas');
            if (!canvas[0].getContext) {
                $("#error").show();
                return false;
            }
            var stage = document.getElementById('wrap');
            var main = document.getElementById('main');
            function resizeStage() {
                var scale = Math.min(1, window.innerWidth / 1100);
                stage.style.transform = 'scale(' + scale + ')';
                main.style.height = (680 * scale + 10) + 'px';
            }
            resizeStage();
            $(window).on('resize', resizeStage);
            var width = canvas.width();
            var height = canvas.height();
            canvas.attr("width", width);
            canvas.attr("height", height);
            var opts = {
                seed: {
                    x: width / 2 - 20,
                    color: "rgb(190, 26, 37)",
                    scale: 2
                },
                branch: [
                    [535, 680, 570, 250, 500, 200, 30, 100, [
                        [540, 500, 455, 417, 340, 400, 13, 100, [
                            [450, 435, 434, 430, 394, 395, 2, 40]
                        ]],
                        [550, 445, 600, 356, 680, 345, 12, 100, [
                            [578, 400, 648, 409, 661, 426, 3, 80]
                        ]],
                        [539, 281, 537, 248, 534, 217, 3, 40],
                        [546, 397, 413, 247, 328, 244, 9, 80, [
                            [427, 286, 383, 253, 371, 205, 2, 40],
                            [498, 345, 435, 315, 395, 330, 4, 60]
                        ]],
                        [546, 357, 608, 252, 678, 221, 6, 100, [
                            [590, 293, 646, 277, 648, 271, 2, 80]
                        ]]
                    ]]
                ],
                bloom: {
                    num: 700,
                    width: 1080,
                    height: 650,
                },
                footer: {
                    width: 1200,
                    height: 5,
                    speed: 10,
                }
            };
            var tree = new Tree(canvas[0], width, height, opts);
            var seed = tree.seed;
            var foot = tree.footer;
            var hold = 1;
            canvas.click(function(e) {
                var rect = canvas[0].getBoundingClientRect(),
                    x, y;
                x = (e.clientX - rect.left) * canvas[0].width / rect.width;
                y = (e.clientY - rect.top) * canvas[0].height / rect.height;
                if (seed.hover(x, y)) {
                    hold = 0;
                    canvas.unbind("click");
                    canvas.unbind("mousemove");
                    canvas.removeClass('hand');
                }
            }).mousemove(function(e) {
                var rect = canvas[0].getBoundingClientRect(),
                    x, y;
                x = (e.clientX - rect.left) * canvas[0].width / rect.width;
                y = (e.clientY - rect.top) * canvas[0].height / rect.height;
                canvas.toggleClass('hand', seed.hover(x, y));
            });
            var seedAnimate = eval(Jscex.compile("async", function() {
                seed.draw();
                while (hold) {
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canScale()) {
                    seed.scale(0.95);
                    $await(Jscex.Async.sleep(10));
                }
                while (seed.canMove()) {
                    seed.move(0, 2);
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
            }));
            var growAnimate = eval(Jscex.compile("async", function() {
                do {
                    tree.grow();
                    $await(Jscex.Async.sleep(10));
                }
                while (tree.canGrow());
            }));
            var flowAnimate = eval(Jscex.compile("async", function() {
                do {
                    tree.flower(2);
                    $await(Jscex.Async.sleep(10));
                }
                while (tree.canFlower());
            }));
            var moveAnimate = eval(Jscex.compile("async", function() {
                tree.snapshot("p1", 240, 0, 610, 680);
                while (tree.move("p1", 500, 0)) {
                    foot.draw();
                    $await(Jscex.Async.sleep(10));
                }
                foot.draw();
                tree.snapshot("p2", 500, 0, 610, 680);
                canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
                canvas.css("background", "#ffe0f0");   // 柔和的粉红
                $await(Jscex.Async.sleep(300));
                canvas.css("background", "none");
            }));
            var jumpAnimate = eval(Jscex.compile("async", function() {
                var ctx = tree.ctx;
                while (true) {
                    tree.ctx.clearRect(0, 0, width, height);
                    tree.jump();
                    foot.draw();
                    $await(Jscex.Async.sleep(25));
                }
            }));
            var textAnimate = eval(Jscex.compile("async", function() {
                var together = new Date();
		together.setFullYear(2025, 10 - 1, 25);   // 2025 年 10 月 25 日
		together.setHours(22);                    // 22 点
		together.setMinutes(30);                  // 30 分
		together.setSeconds(0);
		together.setMilliseconds(0);
                $("#code").show().typewriter();
                $("#clock-box").fadeIn(500);
                while (true) {
                    timeElapse(together);
                    $await(Jscex.Async.sleep(1000));
                }
            }));
            var runAsync = eval(Jscex.compile("async", function() {
                $await(seedAnimate());
                $await(growAnimate());
                $await(flowAnimate());
                $await(moveAnimate());
                textAnimate().start();
                $await(jumpAnimate());
            }));
            runAsync().start();
        })();
    </script>

    <script>
        (function () {
            var bgm = document.getElementById('bgm');
            var toggle = document.getElementById('bgmToggle');
            var status = document.getElementById('bgmStatus');

            function syncMusicState() {
                var playing = !bgm.paused;
                toggle.innerHTML = playing ? '<span aria-hidden="true">&#10074;&#10074;</span>' : '<span aria-hidden="true">&#9654;</span>';
                toggle.setAttribute('aria-label', playing ? '暂停音乐' : '播放音乐');
                toggle.title = playing ? '暂停音乐' : '播放音乐';
                toggle.setAttribute('aria-pressed', String(playing));
                status.textContent = playing ? '正在播放' : '已暂停';
            }

            toggle.addEventListener('click', function () {
                if (bgm.paused) {
                    bgm.play().catch(function () {
                        status.textContent = '播放失败，请重试';
                    });
                } else {
                    bgm.pause();
                }
            });
            bgm.addEventListener('play', syncMusicState);
            bgm.addEventListener('pause', syncMusicState);
            bgm.addEventListener('ended', syncMusicState);
            bgm.addEventListener('error', function () {
                status.textContent = '音乐加载失败';
            });
            syncMusicState();
        }());
    </script>
    <script src="../common.js"></script>
  <script src="../../../../personal/site/lab-shell.js" defer></script>
</body>
</html>
