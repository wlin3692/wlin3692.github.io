<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="可交互的流星雨场景">
  <title>流星雨</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; margin: 0; overflow: hidden; background: #070a12; }
    .sky { position: fixed; inset: 0; overflow: hidden; background: radial-gradient(ellipse at bottom, #152c41 0%, #0b101b 56%, #070a12 100%); touch-action: manipulation; }
    .sky::before { content: ""; position: absolute; inset: -30%; background: linear-gradient(125deg, transparent 32%, rgba(133, 164, 205, .025) 43%, rgba(190, 211, 235, .08) 50%, rgba(118, 151, 193, .03) 58%, transparent 70%); filter: blur(20px); transform: rotate(-8deg); pointer-events: none; }
    .star-dot {
      position: absolute;
      top: var(--star-y);
      left: var(--star-x);
      z-index: 1;
      width: var(--star-size);
      height: var(--star-size);
      border-radius: 50%;
      background: var(--star-color);
      box-shadow: 0 0 var(--star-glow) color-mix(in srgb, var(--star-color) 70%, transparent);
      opacity: var(--star-opacity);
      animation: star-twinkle var(--twinkle-duration) var(--twinkle-delay) infinite ease-in-out;
    }
    @keyframes star-twinkle {
      0%, 100% { opacity: var(--star-opacity); transform: scale(.86); }
      50% { opacity: calc(var(--star-opacity) * .38); transform: scale(1.12); }
    }
    .meteor {
      position: absolute;
      top: var(--top);
      left: var(--left);
      z-index: 2;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 7px 3px rgba(204, 229, 255, .38);
      opacity: 0;
      transform: rotate(-38deg);
      animation: meteor var(--duration) var(--delay) infinite ease-in;
    }
    .meteor::after { content: ""; position: absolute; top: 1px; left: 3px; width: clamp(70px, 12vw, 140px); height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(210, 235, 255, .7), transparent); transform-origin: left center; }
    @keyframes meteor {
      0% { opacity: 0; translate: 0 0; }
      8%, 30% { opacity: 1; }
      62%, 100% { opacity: 0; translate: -48vw 48vw; }
    }
    .wish { position: fixed; right: 20px; bottom: max(28px, env(safe-area-inset-bottom)); left: 20px; z-index: 3; width: auto; max-width: calc(100vw - 40px); margin: 0 auto; overflow-wrap: anywhere; color: rgba(231, 241, 255, .82); font: 500 clamp(.88rem, 3.6vw, 1.15rem)/1.55 "Microsoft YaHei", system-ui, sans-serif; text-align: center; text-shadow: 0 2px 12px #000; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .star-dot, .meteor { animation: none; } .meteor { opacity: .7; } }
  </style>
  <link rel="stylesheet" href="../../../../personal/site/lab-shell.css">
</head>
<body>
  <main class="sky" id="sky" aria-label="流星雨场景"></main>
  <p class="wish">愿每一颗划过的星，都替我把喜欢告诉你。</p>
  <script>
    const sky = document.getElementById('sky');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function createStarfield() {
      const area = innerWidth * innerHeight;
      const count = Math.max(95, Math.min(230, Math.round(area / 4200)));
      const fragment = document.createDocumentFragment();
      const colors = ['#ffffff', '#e8f2ff', '#d7e7ff', '#fff4dc'];

      for (let index = 0; index < count; index += 1) {
        const star = document.createElement('span');
        const depth = Math.pow(Math.random(), 2.8);
        const size = .65 + depth * 2.35;
        const opacity = .28 + Math.random() * .66;
        star.className = 'star-dot';
        star.setAttribute('aria-hidden', 'true');
        star.style.setProperty('--star-x', (Math.random() * 100).toFixed(3) + '%');
        star.style.setProperty('--star-y', (Math.random() * 100).toFixed(3) + '%');
        star.style.setProperty('--star-size', size.toFixed(2) + 'px');
        star.style.setProperty('--star-opacity', opacity.toFixed(2));
        star.style.setProperty('--star-color', colors[Math.floor(Math.random() * colors.length)]);
        star.style.setProperty('--star-glow', (1 + depth * 7).toFixed(1) + 'px');
        star.style.setProperty('--twinkle-duration', (2.6 + Math.random() * 5.8).toFixed(2) + 's');
        star.style.setProperty('--twinkle-delay', (-Math.random() * 8).toFixed(2) + 's');
        fragment.appendChild(star);
      }

      sky.appendChild(fragment);
    }

    function addMeteor(x, y, temporary) {
      const meteor = document.createElement('span');
      meteor.className = 'meteor';
      meteor.style.setProperty('--left', x + '%');
      meteor.style.setProperty('--top', y + '%');
      meteor.style.setProperty('--delay', temporary ? '0s' : (-Math.random() * 9).toFixed(2) + 's');
      meteor.style.setProperty('--duration', (4.5 + Math.random() * 3.5).toFixed(2) + 's');
      sky.appendChild(meteor);
      if (temporary) meteor.addEventListener('animationiteration', function () { meteor.remove(); }, { once: true });
    }

    createStarfield();

    for (let index = 0; index < (innerWidth < 600 ? 9 : 15); index += 1) {
      addMeteor(22 + Math.random() * 92, Math.random() * 38, false);
    }

    if (!reduceMotion) {
      sky.addEventListener('pointerdown', function (event) {
        addMeteor(event.clientX / innerWidth * 100, event.clientY / innerHeight * 100, true);
      });
    }
  </script>
  <script src="../common.js"></script>
  <script src="../../../../personal/site/lab-shell.js" defer></script>
</body>
</html>
