<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专注倒计时</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>COUNTDOWN LAB / 036</span><b>FOCUS TIMER</b></header><main class="micro-main micro-center"><p class="micro-eyebrow">TIME / INTENTION</p><h1>给这一小时<br><em>一个清晰的终点。</em></h1><p class="micro-lead" style="margin-left:auto;margin-right:auto">设置一个短时段，专注完成一件事。时间到了，页面会给你一个温和提醒。</p><section class="micro-panel"><div class="micro-row"><input id="minutes" class="micro-input" type="number" min="1" max="90" value="25"><span>分钟</span><button id="start" class="micro-button">开始计时</button><button id="reset" class="micro-button secondary">重置</button></div><div class="micro-big micro-timer" id="clock" style="margin-top:28px">25:00</div><div class="micro-progress" style="margin-top:18px"><i id="bar"></i></div><p class="micro-note" id="state">准备好后按开始</p></section></main><footer class="micro-footer"><span>基于 Animated Countdown · MIT License</span><span>适合番茄工作法</span></footer><script>const min=document.querySelector('#minutes'),clock=document.querySelector('#clock'),bar=document.querySelector('#bar'),state=document.querySelector('#state');let left=1500,total=1500,timer;function show(){clock.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;bar.style.width=`${(1-left/total)*100}%`}start.onclick=()=>{if(timer)return;total=left=Math.max(60,(+min.value||25)*60);state.textContent='专注进行中';timer=setInterval(()=>{left--;show();if(left<=0){clearInterval(timer);timer=null;state.textContent='时间到，站起来走动一下。'}},1000);show()};reset.onclick=()=>{clearInterval(timer);timer=null;left=(+min.value||25)*60;state.textContent='准备好后按开始';show()};min.oninput=()=>{if(!timer){left=(+min.value||25)*60;total=left;show()}};show();</script></body></html>
