<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录</title>
<style>
:root{
  --primary:#6366f1;
  --primary-dark:#4f46e5;
  --accent:#8b5cf6;
  --glass-bg:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.15);
  --text-primary:rgba(255,255,255,.95);
  --text-secondary:rgba(255,255,255,.65);
  --error:#f87171;
  --success:#34d399;
  --radius:16px;
  --shadow:0 25px 50px -12px rgba(0,0,0,.5);
  --ease-out-expo:cubic-bezier(.16,1,.3,1)
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei UI","PingFang SC",system-ui,-apple-system,sans-serif}
body{height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;background:#0f172a;position:relative}
.background-scene{position:fixed;inset:0;z-index:0;pointer-events:none;transition:transform .3s ease-out}
#canvas-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(120px);opacity:.35;z-index:0;animation:float 20s ease-in-out infinite}
.bg-glow.a{top:-200px;left:-100px;background:var(--primary)}
.bg-glow.b{bottom:-200px;right:-100px;background:var(--accent);animation-delay:-10s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-30px) scale(1.1)}66%{transform:translate(-20px,20px) scale(.95)}}
.login-wrap{position:relative;z-index:10;width:420px;max-width:92vw;padding:48px 40px;border-radius:var(--radius);background:var(--glass-bg);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--glass-border);box-shadow:var(--shadow);animation:slideUp .7s var(--ease-out-expo);transition:all .8s var(--ease-out-expo)}
@keyframes slideUp{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.login-header{text-align:center;margin-bottom:36px}
.login-header .avatar{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(99,102,241,.35);animation:avatarPulse 3s ease-in-out infinite}
@keyframes avatarPulse{0%,100%{box-shadow:0 8px 32px rgba(99,102,241,.3)}50%{box-shadow:0 8px 40px rgba(99,102,241,.5)}}
.login-header .avatar svg{width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login-header h1{font-size:26px;font-weight:700;color:var(--text-primary);letter-spacing:.5px;margin-bottom:6px}
.login-header p{font-size:14px;color:var(--text-secondary);font-weight:300}
.form-group{margin-bottom:20px;position:relative}
.form-group label{display:block;margin-bottom:8px;font-size:13px;color:var(--text-secondary);font-weight:500;letter-spacing:.3px;transition:color .3s}
.form-group:focus-within label{color:var(--text-primary)}
.input-wrap{position:relative}
.input-wrap input{width:100%;padding:14px 44px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;color:var(--text-primary);font-size:15px;transition:all .3s var(--ease-out-expo);outline:none}
.input-wrap input::placeholder{color:rgba(255,255,255,.35);font-weight:300}
.input-wrap input:focus{background:rgba(255,255,255,.1);border-color:rgba(99,102,241,.5);box-shadow:0 0 0 4px rgba(99,102,241,.1),0 4px 20px rgba(0,0,0,.1)}
.input-wrap input.error{border-color:var(--error);box-shadow:0 0 0 4px rgba(248,113,113,.1);animation:shake .5s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:rgba(255,255,255,.4);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;transition:stroke .3s}
.input-wrap input:focus~.input-icon{stroke:var(--primary)}
.toggle-eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;cursor:pointer;opacity:.5;transition:all .2s;stroke:var(--text-secondary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toggle-eye:hover{opacity:1;stroke:var(--text-primary)}
.clear-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%) scale(0);width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.1);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:all .25s var(--ease-out-expo);color:var(--text-secondary);font-size:12px;line-height:1;padding:0}
.clear-btn.show{transform:translateY(-50%) scale(1);opacity:1}
.clear-btn:hover{background:rgba(255,255,255,.2);color:var(--text-primary)}
#password~.clear-btn{right:40px}
.caps-hint{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--error);background:rgba(248,113,113,.15);padding:2px 8px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s}
.caps-hint.show{opacity:1}
.options{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:13px}
.remember{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--text-secondary);transition:color .2s}
.remember:hover{color:var(--text-primary)}
.remember input{appearance:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-radius:5px;position:relative;cursor:pointer;transition:all .2s}
.remember input:checked{background:var(--primary);border-color:var(--primary)}
.remember input:checked::after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.forgot{color:var(--text-secondary);text-decoration:none;font-size:13px;transition:all .2s;position:relative}
.forgot::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--primary);transition:width .3s}
.forgot:hover{color:var(--text-primary)}
.forgot:hover::after{width:100%}
.login-btn-wrap{position:relative;display:inline-block;width:100%;transition:transform .25s var(--ease-out-expo)}
.login-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-size:16px;font-weight:600;cursor:pointer;position:relative;overflow:hidden;transition:all .3s var(--ease-out-expo);box-shadow:0 8px 32px rgba(99,102,241,.35);letter-spacing:.5px}
.login-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.2),transparent);transform:translateX(-100%);transition:transform .6s}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(99,102,241,.45)}
.login-btn:hover::before{transform:translateX(100%)}
.login-btn:active{transform:translateY(0)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-btn .btn-text{display:inline-flex;align-items:center;gap:8px;transition:opacity .3s;position:relative;z-index:2}
.login-btn .loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:3}
.login-btn .loader::after{content:'';width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-20px);padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .4s var(--ease-out-expo);z-index:1000;backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.25);color:#fecaca}
.toast.success{background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.25);color:#a7f3d0}
.toast svg{width:18px;height:18px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;flex-shrink:0}
.divider{display:flex;align-items:center;gap:16px;margin:28px 0;color:var(--text-secondary);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1)}
.socials{display:flex;gap:12px;justify-content:center}
.social-btn{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;color:var(--text-secondary)}
.social-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:var(--text-primary);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.social-btn svg{width:20px;height:20px;fill:currentColor}
.register{text-align:center;margin-top:24px;font-size:14px;color:var(--text-secondary)}
.register a{color:var(--text-primary);text-decoration:none;font-weight:500;position:relative;margin-left:4px}
.register a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--primary);transition:width .3s}
.register a:hover::after{width:100%}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-box{width:360px;max-width:90vw;padding:32px;border-radius:var(--radius);background:rgba(15,23,42,.95);border:1px solid var(--glass-border);transform:scale(.9) translateY(20px);transition:transform .3s var(--ease-out-expo);box-shadow:var(--shadow)}
.modal-overlay.active .modal-box{transform:scale(1) translateY(0)}
.modal-box h3{font-size:20px;color:var(--text-primary);margin-bottom:8px}
.modal-box p{font-size:14px;color:var(--text-secondary);margin-bottom:20px}
.modal-box input{width:100%;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:var(--text-primary);font-size:14px;outline:none;transition:all .3s;margin-bottom:20px}
.modal-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.modal-actions{display:flex;gap:12px}
.modal-actions button{flex:1;padding:12px;border-radius:10px;border:none;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.modal-actions .cancel{background:rgba(255,255,255,.08);color:var(--text-secondary);border:1px solid rgba(255,255,255,.1)}
.modal-actions .cancel:hover{background:rgba(255,255,255,.14);color:var(--text-primary)}
.modal-actions .confirm{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 4px 16px rgba(99,102,241,.3)}
.modal-actions .confirm:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(99,102,241,.4)}
.success-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .6s}
.success-overlay.active{opacity:1}
.success-particles{position:absolute;inset:0;overflow:hidden}
.success-particle{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--primary);opacity:0;animation:particleBurst 1s var(--ease-out-expo) forwards}
@keyframes particleBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
.success-text{font-size:24px;font-weight:700;color:#fff;opacity:0;transform:scale(.8);animation:successPop .5s var(--ease-out-expo) .3s forwards;position:relative;z-index:2}
@keyframes successPop{to{opacity:1;transform:scale(1)}}
.particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:rgba(255,255,255,.15);border-radius:50%;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}
@media(max-width:480px){.login-wrap{padding:36px 24px}.login-header h1{font-size:22px}.options{gap:12px}.forgot{white-space:nowrap}}

/* UI upgrade: the starfield above remains unchanged. */

.login-wrap::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.12),transparent 24%,transparent 70%,rgba(99,102,241,.12));pointer-events:none}

.login-wrap:hover::after{opacity:1}

.login-header{position:relative;margin-bottom:30px;z-index:1}

.eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:#34d399;box-shadow:0 0 12px #34d399}

.input-wrap:focus-within::after{transform:scaleX(1)}
.input-wrap input{height:52px;padding:14px 44px 14px 46px;background:rgba(15,23,42,.46);border-color:rgba(148,163,184,.2);border-radius:14px;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.input-wrap input:focus{background:rgba(15,23,42,.66);border-color:rgba(129,140,248,.7);box-shadow:0 0 0 4px rgba(99,102,241,.12),inset 0 1px 0 rgba(255,255,255,.08)}

.input-wrap input:focus~.input-icon{stroke:#a5b4fc;filter:drop-shadow(0 0 5px rgba(165,180,252,.7))}

.login-btn:hover{box-shadow:0 16px 36px rgba(99,102,241,.48),inset 0 1px 0 rgba(255,255,255,.4)}

/* Selected feature additions: status, account history and reset flow. */
.login-wrap.has-focus{border-color:rgba(129,140,248,.58);box-shadow:0 34px 88px rgba(0,0,0,.48),0 0 34px rgba(99,102,241,.12),inset 0 1px 0 rgba(255,255,255,.18)}
.login-header .eyebrow{transition:background .3s,border-color .3s,transform .3s}
.login-wrap.has-focus .eyebrow{background:rgba(99,102,241,.18);border-color:rgba(165,180,252,.48);transform:translateY(-1px)}
.account-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-8px 2px 16px;min-height:24px}
.account-tools button{border:0;background:transparent;color:rgba(196,181,253,.82);font-size:11px;cursor:pointer;padding:3px 0;transition:color .2s}
.account-tools button:hover{color:#fff}

function getTimePhase(hour) {
  if (hour >= 0 && hour < 6) return { icon: '🌙', text: '凌晨好，注意休息' };
  if (hour >= 6 && hour < 12) return { icon: '🌅', text: '早安，开启新的一天' };
  if (hour >= 12 && hour < 14) return { icon: '☀️', text: '午安，记得休息' };
  if (hour >= 14 && hour < 18) return { icon: '🌤️', text: '下午好，保持专注' };
  if (hour >= 18 && hour < 23) return { icon: '🌆', text: '晚上好，欢迎回来' };
  return { icon: '🌙', text: '夜深了，早点休息' };
}

function updateTimeGreeting() {
  const now = new Date();
  const hour = now.getHours();
  const minute = now.getMinutes();
  const phase = getTimePhase(hour);
  greetingText.textContent = phase.icon + ' ' + phase.text;
  timeClock.textContent = String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
}

let rippleVariant = 0;

function createRipple(container) {
  let clip = container.querySelector('.ripple-clip');
  if (!clip) {
    clip = document.createElement('span');
    clip.className = 'ripple-clip';
    clip.setAttribute('aria-hidden', 'true');
    container.prepend(clip);
  }
  const ring = document.createElement('div');
  ring.className = 'ripple-ring variant-' + (rippleVariant % 3);
  clip.appendChild(ring);
  rippleVariant++;
  setTimeout(() => ring.remove(), 700);
}

function attachRipple(input, container) {
  input.addEventListener('keydown', (e) => {
    if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Enter') {
      createRipple(container);
    }
  });
}

function showToast(message, type = 'error') {
  toastText.textContent = message;
  toast.className = 'toast ' + (type === 'error' ? 'error' : 'success');
  toastIcon.innerHTML = type === 'success'
    ? '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>'
    : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

function readRecentAccounts() {
  try {
    const accounts = JSON.parse(localStorage.getItem(RECENT_KEY) || '[]');
    return Array.isArray(accounts) ? accounts.filter(Boolean).slice(0, 3) : [];
  } catch (error) {
    return [];
  }
}
function renderRecentAccounts() {
  const accounts = readRecentAccounts();
  accountHistory.innerHTML = '';
  recentAccountLabel.textContent = accounts.length ? `${accounts.length} 个账号` : '暂无记录';
  accountHistory.classList.toggle('show', accounts.length > 0);
  accounts.forEach(account => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'recent-account-item';
    button.textContent = account;
    button.addEventListener('click', () => {
      username.value = account;
      updateClearButton(username, clearUser);
      accountHistory.classList.remove('show');
      password.focus();
    });
    accountHistory.appendChild(button);
  });
}
function rememberRecentAccount(account) {
  try {
    const accounts = [account, ...readRecentAccounts().filter(item => item !== account)].slice(0, 3);
    localStorage.setItem(RECENT_KEY, JSON.stringify(accounts));
    renderRecentAccounts();
  } catch (error) {}
}
function clearLoginHistory() {
  try {
    localStorage.removeItem(RECENT_KEY);
    localStorage.removeItem('savedUser');
  } catch (error) {}
  rememberMe.checked = false;
  renderRecentAccounts();
  showToast('登录记录已清除', 'success');
}

function readAttemptState() {
  try {
    const state = JSON.parse(localStorage.getItem(ATTEMPTS_KEY) || '{}');
    if (state.lockedUntil && state.lockedUntil > Date.now()) return state;
    if (state.lockedUntil || state.count > 0) localStorage.removeItem(ATTEMPTS_KEY);
  } catch (error) {}
  return { count: 0, lockedUntil: 0 };
}
function saveAttemptState(state) {
  try { localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(state)); } catch (error) {}
}
function applyLoginCooldown(until) {
  clearInterval(cooldownTimer);
  cooldownUntil = until;
  loginBtn.classList.add('cooldown');
  loginBtn.disabled = true;
  const update = () => {
    const seconds = Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000));
    if (!seconds) {
      clearInterval(cooldownTimer);
      cooldownUntil = 0;
      loginBtn.classList.remove('cooldown');
      loginBtn.disabled = false;
      btnText.innerHTML = '重新登录 <span class="btn-icon" aria-hidden="true">→</span>';
      loginStatus.textContent = '可以再次尝试登录';
      loginStatus.className = 'login-status';
      return;
    }
    btnText.textContent = `请稍候 ${seconds}s`;
    loginStatus.textContent = `尝试次数过多，请等待 ${seconds} 秒`;
    loginStatus.className = 'login-status cooldown';
  };
  update();
  cooldownTimer = setInterval(update, 250);
}
function registerFailedAttempt() {
  const state = readAttemptState();
  state.count = (state.count || 0) + 1;
  if (state.count >= 3) {
    state.count = 0;
    state.lockedUntil = Date.now() + 15000;
    saveAttemptState(state);
    applyLoginCooldown(state.lockedUntil);
  } else {
    saveAttemptState(state);
    const left = 3 - state.count;
    loginStatus.textContent = `账号或密码不匹配，还可尝试 ${left} 次`;
  }
}
function resetFailedAttempts() {
  try { localStorage.removeItem(ATTEMPTS_KEY); } catch (error) {}
}

function updatePasswordStrength(value) {
  const score = [value.length >= 6, /[A-Z]/.test(value) || /[\u4e00-\u9fa5]/.test(value), /\d/.test(value) && /[^A-Za-z0-9]/.test(value)].filter(Boolean).length;
  const level = score <= 1 ? 'weak' : score === 2 ? 'fair' : 'strong';
  passwordStrength.className = 'password-strength' + (value ? ' ' + level : '');
  passwordStrengthText.className = 'password-strength-text' + (value ? ' ' + level : '');
  passwordStrengthText.textContent = value ? (level === 'weak' ? '较弱' : level === 'fair' ? '一般' : '较强') : '密码强度';
}

function saveDraft() {
  try {
    sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ user: username.value, pass: password.value, time: Date.now() }));
  } catch (error) {
    // Storage may be disabled by the browser; login remains usable without drafts.
  }
}
function loadDraft() {
  try {
    const raw = sessionStorage.getItem(DRAFT_KEY);
    if (!raw) return;
    const draft = JSON.parse(raw);
    if (Date.now() - draft.time < 3600000) {
      username.value = draft.user || '';
      password.value = draft.pass || '';
      updateClearButton(username, clearUser);
      updateClearButton(password, clearPass);
      updatePasswordStrength(password.value);
    }
  } catch (error) {
    try { sessionStorage.removeItem(DRAFT_KEY); } catch (storageError) {}
  }
}

  if (savedUser) {
    username.value = savedUser;
    rememberMe.checked = true;
    updateClearButton(username, clearUser);
  }
  const attemptState = readAttemptState();
  if (attemptState.lockedUntil > Date.now()) applyLoginCooldown(attemptState.lockedUntil);
});

document.addEventListener('mousemove', event => {
  const rect = btnWrap.getBoundingClientRect();
  const dx = event.clientX - (rect.left + rect.width / 2);
  const dy = event.clientY - (rect.top + rect.height / 2);
  const distance = Math.sqrt(dx * dx + dy * dy);
  if (distance < 120) {
    const pull = (120 - distance) / 120;
    btnWrap.style.transform = `translate(${dx * pull * 0.15}px, ${dy * pull * 0.15}px)`;
  } else {
    btnWrap.style.transform = 'translate(0, 0)';

});

let isSubmitting = false;
loginForm.addEventListener('submit', event => {
  event.preventDefault();
  if (isSubmitting) return;
  if (cooldownUntil > Date.now()) {
       applyLoginCooldown(cooldownUntil);
    return;
  }

  const user = username.value.trim();
  const pass = password.value.trim();
  username.classList.remove('error');
  password.classList.remove('error');
  loginStatus.className = 'login-status';
  if (!user || !pass) {
    showToast('请输入账号和密码');
    loginStatus.textContent = '请补充完整登录信息';
    loginStatus.classList.add('error');
    if (!user) username.classList.add('error');
    if (!pass) password.classList.add('error');
    return;
  }

  isSubmitting = true;
  loginBtn.disabled = true;
  loginBtn.classList.add('is-loading');
  loginStatus.textContent = '正在验证登录信息...';
  btnText.style.opacity = '0';
  loader.style.display = 'flex';
  setTimeout(() => {
    isSubmitting = false;
    loginBtn.disabled = false;
    loginBtn.classList.remove('is-loading');
    btnText.style.opacity = '1';
    loader.style.display = 'none';
    if (user === 'lin' && pass === '36923692') {
      if (rememberMe.checked) localStorage.setItem('savedUser', user);
      else localStorage.removeItem('savedUser');
      sessionStorage.removeItem(DRAFT_KEY);
      resetFailedAttempts();
      rememberRecentAccount(user);
      loginStatus.textContent = '验证通过，正在进入空间';
      loginStatus.className = 'login-status success';
      showElegantSuccess();
    } else {
      showToast('账号或密码错误');
      loginStatus.textContent = '账号或密码不匹配，请重新输入';
      loginStatus.className = 'login-status error';
      btnText.innerHTML = '重新登录 <span class="btn-icon" aria-hidden="true">→</span>';
      username.classList.add('error');
      password.classList.add('error');
      registerFailedAttempt();
      setTimeout(() => { username.classList.remove('error'); password.classList.remove('error'); }, 3000);
    }
  }, 1500);
});

function showElegantSuccess() {
  const rect = loginWrap.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  for (let i = 0; i < 30; i++) {
    const particle = document.createElement('div');
    const angle = (Math.PI * 2 * i) / 30 + Math.random() * 0.5;
    const distance = 100 + Math.random() * 200;
    particle.className = 'success-particle';
    particle.style.left = centerX + 'px';
    particle.style.top = centerY + 'px';
    particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
    particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
    particle.style.animationDelay = Math.random() * 0.3 + 's';
    particle.style.background = ['#6366f1', '#8b5cf6', '#34d399', '#a5b4fc'][Math.floor(Math.random() * 4)];
    successParticles.appendChild(particle);
  }
  successOverlay.classList.add('active');
  loginWrap.style.transform = 'scale(.9) translateY(-20px)';
  loginWrap.style.opacity = '0';
  loginWrap.style.filter = 'blur(8px)';
  let seconds = 3;
  successCountdown.textContent = seconds;
  const countdownTimer = setInterval(() => {
    seconds -= 1;
    successCountdown.textContent = Math.max(seconds, 0);
    if (seconds <= 0) clearInterval(countdownTimer);
  }, 1000);
}

const canvas = $('#canvas-bg');
const context = canvas.getContext('2d');
let width;
let height;
function resizeCanvas() {
  width = canvas.width = innerWidth;
  height = canvas.height = innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
class Node {
  constructor() {
    this.x = Math.random() * width;
    this.y = Math.random() * height;
    this.vx = (Math.random() - .5) * .3;
    this.vy = (Math.random() - .5) * .3;
    this.radius = Math.random() * 1.5 + 1;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0 || this.x > width) this.vx *= -1;
    if (this.y < 0 || this.y > height) this.vy *= -1;
  }
  draw() {
    context.beginPath();
    context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    context.fillStyle = 'rgba(99,102,241,' + (this.radius / 3) + ')';
    context.fill();
  }
}
const nodes = Array.from({ length: 60 }, () => new Node());
function animateBackground() {
  context.clearRect(0, 0, width, height);
  nodes.forEach(node => {
    node.update();
    node.draw();
    nodes.forEach(other => {
      const dx = node.x - other.x;
      const dy = node.y - other.y;
      const distance = Math.sqrt(dx * dx + dy * dy);
      if (distance < 150) {
        context.beginPath();
        context.moveTo(node.x, node.y);
        context.lineTo(other.x, other.y);
        context.strokeStyle = 'rgba(99,102,241,' + (1 - distance / 150) * .12 + ')';
        context.stroke();
      }
    });
  });
  requestAnimationFrame(animateBackground);
}

  particleContainer.appendChild(particle);
}
