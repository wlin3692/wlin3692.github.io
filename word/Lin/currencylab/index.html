<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汇率换算台</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>CURRENCY LAB / 024</span><b>OFFLINE RATES</b></header><main class="micro-main"><p class="micro-eyebrow">MONEY / QUICK CONVERT</p><h1>换算一笔<br><em>旅途预算。</em></h1><p class="micro-lead">使用内置的演示汇率快速估算，不连接任何外部服务。实际结算请以银行汇率为准。</p><section class="micro-panel"><div class="micro-row"><input class="micro-input" id="amount" type="number" value="100"><select class="micro-select" id="from"><option value="1">人民币 CNY</option><option value="7.2">美元 USD</option><option value="7.8">港币 HKD</option><option value="7.7">欧元 EUR</option></select><span>→</span><select class="micro-select" id="to"><option value="7.2">美元 USD</option><option value="1">人民币 CNY</option><option value="7.8">港币 HKD</option><option value="7.7">欧元 EUR</option></select></div><div class="micro-result" id="result">-</div><p class="micro-note">演示基准：1 美元 ≈ 7.20 人民币 · 仅用于界面交互展示</p></section></main><footer class="micro-footer"><span>基于 Exchange Rate Calculator · MIT License</span><span>本地演示数据</span></footer><script>const amount=document.querySelector('#amount'),from=document.querySelector('#from'),to=document.querySelector('#to'),result=document.querySelector('#result');function calc(){const a=+amount.value||0;const value=a*(+to.value/+from.value);result.textContent=`${a.toFixed(2)} → ${value.toFixed(2)}`}[amount,from,to].forEach(x=>x.oninput=calc);calc();</script></body></html>
