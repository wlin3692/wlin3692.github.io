<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容占位符</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>PLACEHOLDER LAB / 056</span><b>CONTENT STATE</b></header><main class="micro-main"><p class="micro-eyebrow">SKELETON / CONTENT</p><h1>内容还没来时，<br><em>先给它一个形状。</em></h1><p class="micro-lead">切换占位状态和真实状态，看看加载中的结构如何提前稳定版式。</p><section class="micro-panel"><article id="card" style="padding:18px;background:#fff"><div id="avatar" style="width:54px;height:54px;border-radius:50%;background:#d9eee0"></div><div id="title" style="height:18px;width:55%;margin:16px 0 10px;background:#d9eee0"></div><div id="lines" style="height:10px;width:90%;background:#e8ece8"></div><div style="height:10px;width:70%;margin-top:8px;background:#e8ece8"></div></article><button class="micro-button" id="toggle" style="margin-top:18px">显示真实内容</button></section></main><footer class="micro-footer"><span>基于 Content Placeholder · MIT License</span><span>骨架屏练习</span></footer><script>let loading=true;toggle.onclick=()=>{loading=!loading;avatar.style.background=loading?'#d9eee0':'#2f7060';title.style.background=loading?'#d9eee0':'transparent';title.textContent=loading?'':'内容已经抵达';title.style.width=loading?'55%':'100%';lines.style.background=loading?'#e8ece8':'transparent';toggle.textContent=loading?'显示真实内容':'显示占位状态'};</script></body></html>
