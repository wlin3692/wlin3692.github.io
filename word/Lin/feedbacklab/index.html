<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反馈收集器</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>FEEDBACK LAB / 034</span><b>ONE MINUTE</b></header><main class="micro-main"><p class="micro-eyebrow">FEELING / RESPONSE</p><h1>今天的体验，<br><em>值得几颗星？</em></h1><p class="micro-lead">一个小型反馈界面练习：先选择感受，再留下最重要的一句话。</p><section class="micro-panel"><div class="micro-grid" id="stars"><button class="micro-card" data-v="1"><h3>1 星</h3><p>需要调整</p></button><button class="micro-card" data-v="2"><h3>2 星</h3><p>有点卡住</p></button><button class="micro-card" data-v="3"><h3>3 星</h3><p>还不错</p></button><button class="micro-card" data-v="4"><h3>4 星</h3><p>很顺手</p></button></div><textarea id="text" class="micro-textarea" style="width:100%;margin-top:18px;min-height:100px" placeholder="哪一处最值得记住？"></textarea><button id="submit" class="micro-button" style="margin-top:12px">提交反馈</button><div id="result" class="micro-result" hidden>感谢你的反馈。</div></section></main><footer class="micro-footer"><span>基于 Feedback UI · MIT License</span><span>本地演示</span></footer><script>let selected=0;stars.onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;selected=+b.dataset.v;stars.querySelectorAll('button').forEach(x=>x.classList.toggle('is-active',x===b))};submit.onclick=()=>{result.hidden=false;result.textContent=selected?`已记录 ${selected} 星反馈：${text.value||'未填写文字。'}`:'请先选择星级。'};</script></body></html>
