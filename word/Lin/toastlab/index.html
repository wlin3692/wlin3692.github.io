<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提示消息实验室</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>TOAST LAB / 035</span><b>MICRO FEEDBACK</b></header><main class="micro-main"><p class="micro-eyebrow">NOTIFICATION / MOTION</p><h1>一句提示，<br><em>也可以很有分寸。</em></h1><p class="micro-lead">测试不同状态下的 Toast 消息：成功、提醒、错误，以及它们出现的节奏。</p><section class="micro-panel"><div class="micro-grid"><button class="micro-card" data-type="success"><h3>完成</h3><p>绿色确认消息</p></button><button class="micro-card" data-type="info"><h3>提醒</h3><p>中性信息消息</p></button><button class="micro-card" data-type="warn"><h3>注意</h3><p>黄色警示消息</p></button><button class="micro-card" data-type="error"><h3>错误</h3><p>红色错误消息</p></button></div></section></main><div class="micro-toast" id="toast"></div><footer class="micro-footer"><span>基于 Toast Notification · MIT License</span><span>状态反馈练习</span></footer><script>const toast=document.querySelector('#toast'),texts={success:'已保存这次操作。',info:'这里是一条轻量提醒。',warn:'请先确认这个动作。',error:'暂时无法完成，请稍后再试。'};document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{toast.textContent=texts[b.dataset.type];toast.style.borderLeft=`4px solid ${b.dataset.type==='error'?'#d86b60':b.dataset.type==='warn'?'#e0bd5c':'#bcecc8'}`;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)});</script></body></html>
