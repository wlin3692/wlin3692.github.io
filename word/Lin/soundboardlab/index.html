<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>节奏音板</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>SOUND BOARD / 033</span><b>WEB AUDIO</b></header><main class="micro-main"><p class="micro-eyebrow">SOUND / BUTTON STUDY</p><h1>按下一个，<br><em>让空间响起来。</em></h1><p class="micro-lead">用 Web Audio API 生成短促音色，把按钮、节奏和反馈放在同一个面板里。</p><section class="micro-panel"><div class="micro-grid" id="pads"></div><p class="micro-note">第一次点击会初始化浏览器音频引擎。所有声音即时生成，不读取外部文件。</p></section></main><footer class="micro-footer"><span>基于 Sound Board · MIT License</span><span>即时生成</span></footer><script>const tones=[220,277,330,392,440,523,659,784];const pads=document.querySelector('#pads');tones.forEach((tone,i)=>{const b=document.createElement('button');b.className='micro-card';b.innerHTML=`<h3>PAD 0${i+1}</h3><p>${tone} Hz · 点击播放</p>`;b.onclick=()=>{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type=i%2?'triangle':'sine';o.frequency.value=tone;g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.18,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.35);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.36);b.classList.add('is-active');setTimeout(()=>b.classList.remove('is-active'),180)};pads.append(b)});</script></body></html>
