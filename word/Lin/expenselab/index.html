<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开销记账板</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>EXPENSE LAB / 025</span><b>LOCAL LEDGER</b></header><main class="micro-main"><p class="micro-eyebrow">TRACK / REFLECT</p><h1>看清每一笔<br><em>日常开销。</em></h1><p class="micro-lead">用最少字段记录一次支出，让月底回看时知道钱都去了哪里。</p><section class="micro-panel"><div class="micro-row"><input id="name" class="micro-input" placeholder="项目，例如：午餐"><input id="amount" class="micro-input" type="number" placeholder="金额"><button id="add" class="micro-button">记一笔</button></div><ul id="list" class="micro-list"></ul><div class="micro-result">本页合计：¥<strong id="total">0</strong></div></section></main><footer class="micro-footer"><span>基于 Expense Tracker · MIT License</span><span>数据保存在本机</span></footer><script>const n=document.querySelector('#name'),a=document.querySelector('#amount'),list=document.querySelector('#list'),total=document.querySelector('#total');let items=JSON.parse(localStorage.getItem('lin-expenses')||'[]');function render(){list.innerHTML=items.map((x,i)=>`<li>${x.name}<strong style="float:right">¥${x.amount.toFixed(2)}</strong><button data-i="${i}">删除</button></li>`).join('');total.textContent=items.reduce((s,x)=>s+x.amount,0).toFixed(2);localStorage.setItem('lin-expenses',JSON.stringify(items))}add.onclick=()=>{if(n.value.trim()&&+a.value>0){items.unshift({name:n.value.trim(),amount:+a.value});n.value='';a.value='';render()}};list.onclick=e=>{if(e.target.dataset.i){items.splice(+e.target.dataset.i,1);render()}};render();</script></body></html>
