<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>按键识别台</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>KEYCODE LAB / 045</span><b>KEYBOARD EVENT</b></header><main class="micro-main micro-center"><p class="micro-eyebrow">INPUT / FEEDBACK</p><h1>按一个键，<br><em>看它的身份。</em></h1><p class="micro-lead" style="margin-left:auto;margin-right:auto">点击页面后按任意键，查看 key、code 和 keyCode 的差异。</p><section class="micro-panel"><div class="micro-big" id="key">?</div><div class="micro-stat"><div><b id="code">-</b><span>code</span></div><div><b id="which">-</b><span>keyCode</span></div><div><b id="type">-</b><span>类型</span></div></div></section></main><footer class="micro-footer"><span>基于 Event KeyCodes · MIT License</span><span>键盘实验</span></footer><script>document.onkeydown=e=>{e.preventDefault();key.textContent=e.key.length===1?e.key.toUpperCase():e.key;code.textContent=e.code;which.textContent=e.keyCode;type.textContent=e.repeat?'重复':'按下'};</script></body></html>
