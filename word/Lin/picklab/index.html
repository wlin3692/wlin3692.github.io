<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随机选择器</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>PICK LAB / 047</span><b>RANDOM CHOICE</b></header><main class="micro-main micro-center"><p class="micro-eyebrow">DECIDE / RELEASE</p><h1>选不出来时，<br><em>让随机替你推一下。</em></h1><p class="micro-lead" style="margin-left:auto;margin-right:auto">输入几个选项，用一次轻量随机选择结束犹豫。</p><section class="micro-panel"><textarea id="items" class="micro-textarea" style="width:100%;min-height:100px" placeholder="每行一个选项&#10;散步&#10;读书&#10;看电影"></textarea><button id="pick" class="micro-button" style="margin-top:15px">随机选择</button><div class="micro-result" id="result">等待选项</div></section></main><footer class="micro-footer"><span>基于 Random Choice Picker · MIT License</span><span>随机决定</span></footer><script>pick.onclick=()=>{const arr=items.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);result.textContent=arr.length?`今天就选：${arr[Math.floor(Math.random()*arr.length)]}`:'请先输入至少一个选项'};</script></body></html>
