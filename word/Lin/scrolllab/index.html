<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>滚动出现</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>SCROLL LAB / 042</span><b>REVEAL ON SCROLL</b></header><main class="micro-main"><p class="micro-eyebrow">SCROLL / ARRIVAL</p><h1>向下走，<br><em>让内容逐块抵达。</em></h1><p class="micro-lead">继续滚动查看卡片的进场状态。这个页面本身就是一段小型滚动叙事。</p><section class="micro-list" id="cards"><article class="micro-card"><h3>01 / 观察</h3><p>先看见问题，再决定要不要动手。</p></article><article class="micro-card"><h3>02 / 拆分</h3><p>把一个大目标拆成几个能完成的动作。</p></article><article class="micro-card"><h3>03 / 试做</h3><p>做一个粗糙版本，让反馈尽早出现。</p></article><article class="micro-card"><h3>04 / 迭代</h3><p>保留有效的部分，删掉多余的部分。</p></article></section></main><footer class="micro-footer"><span>基于 Scroll Animation · MIT License</span><span>滚动体验</span></footer><script>const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('is-active')}),{threshold:.3});document.querySelectorAll('#cards article').forEach(x=>io.observe(x));</script></body></html>
