<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数字计数器</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>COUNTER LAB / 049</span><b>NUMBER MOTION</b></header><main class="micro-main micro-center"><p class="micro-eyebrow">COUNT / FEEDBACK</p><h1>看数字慢慢变成<br><em>一件完成的事。</em></h1><p class="micro-lead" style="margin-left:auto;margin-right:auto">输入目标数字，让计数器用一段短动画走到它。</p><section class="micro-panel"><div class="micro-row"><input id="target" class="micro-input" type="number" min="0" max="9999" value="128"><button id="go" class="micro-button">开始计数</button></div><div class="micro-big" id="number" style="margin-top:25px">0</div><div class="micro-progress"><i id="bar"></i></div></section></main><footer class="micro-footer"><span>基于 Incrementing Counter · MIT License</span><span>数字动效</span></footer><script>let current=0,t;go.onclick=()=>{clearInterval(t);const targetValue=Math.max(0,+target.value||0);current=0;number.textContent=0;t=setInterval(()=>{current+=Math.max(1,Math.ceil(targetValue/40));if(current>=targetValue){current=targetValue;clearInterval(t)}number.textContent=current;bar.style.width=targetValue?`${current/targetValue*100}%`:'0%'},30)};</script></body></html>
