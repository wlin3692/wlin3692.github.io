<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>喝水提醒</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>WATER LAB / 050</span><b>GENTLE HABIT</b></header><main class="micro-main"><p class="micro-eyebrow">HYDRATE / CHECK IN</p><h1>今天喝够了吗？<br><em>先记下一杯。</em></h1><p class="micro-lead">每点击一次，就把一杯水放进今天的记录。页面会保存当前进度。</p><section class="micro-panel micro-center"><div class="micro-big" id="count">0 / 8</div><div class="micro-progress"><i id="bar"></i></div><div class="micro-row" style="justify-content:center;margin-top:18px"><button id="add" class="micro-button">+ 记录一杯</button><button id="reset" class="micro-button secondary">重置</button></div><p class="micro-note" id="note">今天还可以再喝 8 杯</p></section></main><footer class="micro-footer"><span>基于 Drink Water · MIT License</span><span>习惯记录</span></footer><script>let cups=+(localStorage.getItem('lin-water')||0);function draw(){count.textContent=`${cups} / 8`;bar.style.width=`${Math.min(100,cups/8*100)}%`;note.textContent=cups>=8?'今天的目标完成了。':`今天还可以再喝 ${8-cups} 杯`;localStorage.setItem('lin-water',cups)}add.onclick=()=>{cups=Math.min(8,cups+1);draw()};reset.onclick=()=>{cups=0;draw()};draw();</script></body></html>
