<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="本地运行的鼠标与触控轨迹效果实验室。"><title>光标效果实验室 · 小林互动作品</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header class="topbar"><a class="brand" href="../../../index.html#portfolio"><span class="brand-mark">✦</span>小林互动作品</a><a class="back-link" href="../../../index.html#portfolio">返回作品集</a></header>
  <main class="cursor-lab">
    <div class="heading"><div><span class="eyebrow">CURSOR EFFECTS / LOCAL MODULES</span><h1>光标效果实验室</h1></div><p>移动鼠标或手指，在画面里留下属于你的轨迹。</p></div>
    <section class="effect-stage" id="effectStage"><div class="stage-copy"><span>MOVE TO EXPLORE</span><strong id="effectName">彩虹轨迹</strong><small id="effectStatus">效果运行中</small></div><div class="stage-grid"></div></section>
    <section class="controls" aria-label="光标效果设置">
      <label><span>效果</span><select id="effectInput"><option value="rainbow">彩虹轨迹</option><option value="bubble">气泡粒子</option><option value="emoji">表情雨</option><option value="fairy">魔法尘埃</option></select></label>
      <label><span>主题</span><select id="themeInput"><option value="warm">珊瑚暖色</option><option value="cool">湖蓝冷色</option><option value="mono">黑白线条</option></select></label>
      <label class="emoji-control"><span>表情</span><select id="emojiInput"><option value="✦">星光 ✦</option><option value="✿">花朵 ✿</option><option value="◆">钻石 ◆</option><option value="☁">云朵 ☁</option></select></label>
      <label class="check-control"><span>减少动态</span><input id="reduceInput" type="checkbox"></label>
      <button id="restartButton" type="button">重新开始</button>
    </section>
    <div class="note-line"><span>触控设备同样支持</span><span>开源基础：tholman / cursor-effects · MIT</span></div>
  </main>
  <footer>基于 Cursor Effects 改造 · MIT License</footer>
  <script type="module" src="script.js"></script>
</body>
</html>
