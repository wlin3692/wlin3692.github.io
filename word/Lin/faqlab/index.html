<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>折叠问答</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>FAQ LAB / 046</span><b>DISCLOSURE</b></header><main class="micro-main"><p class="micro-eyebrow">CONTENT / ANSWER</p><h1>常见问题，<br><em>只展开需要的那一条。</em></h1><p class="micro-lead">一个折叠问答交互练习，让长内容保持可扫描、可收起。</p><section class="micro-panel" id="faq"><div class="micro-card"><h3>这些作品能离线运行吗？</h3><p hidden>大部分页面只依赖本地 HTML、CSS、JavaScript 和少量本地资源。</p></div><div class="micro-card"><h3>数据会上传吗？</h3><p hidden>便签、任务和记账等页面使用浏览器本地存储，不连接服务器。</p></div><div class="micro-card"><h3>可以在手机上打开吗？</h3><p hidden>新增页面都补了移动端布局和触控操作。</p></div></section></main><footer class="micro-footer"><span>基于 FAQ Collapse · MIT License</span><span>折叠内容</span></footer><script>document.querySelectorAll('#faq .micro-card').forEach(c=>c.onclick=()=>{const p=c.querySelector('p');p.hidden=!p.hidden;c.classList.toggle('is-active',!p.hidden)})</script></body></html>
