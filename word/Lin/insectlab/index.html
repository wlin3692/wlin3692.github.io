<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>捕光小游戏</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>INSECT LAB / 021</span><b>30 SECOND GAME</b></header><main class="micro-main"><p class="micro-eyebrow">ARCADE / REFLEX</p><h1>抓住一只<br><em>会发光的小虫。</em></h1><p class="micro-lead">在倒计时结束前点击移动的光点。每次命中都会让它更快。</p><section class="micro-panel micro-center"><div class="micro-stat"><div><b id="score">0</b><span>命中</span></div><div><b id="time">30</b><span>秒数</span></div><div><b id="best">0</b><span>最高</span></div></div><div id="field" style="position:relative;height:300px;margin-top:18px;border:1px solid var(--micro-line);background:#dfeee1;overflow:hidden"><button id="bug" aria-label="点击光点" style="position:absolute;width:36px;height:36px;border:0;border-radius:50%;background:var(--micro-accent);cursor:pointer">✦</button></div><button class="micro-button" id="start" style="margin-top:18px">开始游戏</button></section></main><footer class="micro-footer"><span>基于 Insect Catch Game · MIT License</span><span>触控友好</span></footer><script>const bug=document.querySelector('#bug'),field=document.querySelector('#field'),scoreEl=document.querySelector('#score'),timeEl=document.querySelector('#time'),start=document.querySelector('#start'),bestEl=document.querySelector('#best');let score=0,time=30,timer;bestEl.textContent=localStorage.getItem('lin-insect-best')||0;function move(){bug.style.left=`${Math.random()*(field.clientWidth-42)}px`;bug.style.top=`${Math.random()*(field.clientHeight-42)}px`}start.onclick=()=>{clearInterval(timer);score=0;time=30;scoreEl.textContent=0;timeEl.textContent=30;start.disabled=true;move();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0){clearInterval(timer);start.disabled=false;start.textContent='再玩一次';if(score>+bestEl.textContent){localStorage.setItem('lin-insect-best',score);bestEl.textContent=score}}},1000)};bug.onclick=()=>{if(time>0){score++;scoreEl.textContent=score;move()}};move();</script></body></html>
