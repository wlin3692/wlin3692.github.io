<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆翻牌</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>MEMORY LAB / 026</span><b>PAIR MATCH</b></header><main class="micro-main"><p class="micro-eyebrow">GAME / CONCENTRATION</p><h1>翻开两张，<br><em>找到相同的星球。</em></h1><p class="micro-lead">一个轻量记忆小游戏。记录你的步数，看看能否用更少的尝试完成。</p><section class="micro-panel"><div class="micro-stat"><div><b id="moves">0</b><span>步数</span></div><div><b id="matches">0</b><span>配对</span></div><div><b id="best">-</b><span>最佳</span></div></div><div id="board" class="micro-board"></div><button class="micro-button secondary" id="reset" style="margin-top:18px">重新洗牌</button></section></main><footer class="micro-footer"><span>基于 Memory Cards · MIT License</span><span>触控友好</span></footer><script>const symbols=['☀','☀','☾','☾','✦','✦','✿','✿'];const board=document.querySelector('#board');let first=null,lock=false,moves=0,matches=0;function init(){const arr=[...symbols].sort(()=>Math.random()-.5);board.innerHTML=arr.map((s,i)=>`<button class="micro-cell is-hidden" data-i="${i}" data-s="${s}">${s}</button>`).join('');first=null;lock=false;moves=0;matches=0;update()}function update(){document.querySelector('#moves').textContent=moves;document.querySelector('#matches').textContent=matches;document.querySelector('#best').textContent=localStorage.getItem('lin-memory-best')||'-'}board.onclick=e=>{const card=e.target.closest('[data-i]');if(!card||lock||card.classList.contains('is-flipped')||card.classList.contains('is-matched'))return;card.classList.remove('is-hidden');card.classList.add('is-flipped');if(!first){first=card;return}moves++;if(first.dataset.s===card.dataset.s){first.classList.add('is-matched');card.classList.add('is-matched');matches++;first=null;if(matches===4){const best=+localStorage.getItem('lin-memory-best')||999;if(moves<best)localStorage.setItem('lin-memory-best',moves);update()}}else{lock=true;setTimeout(()=>{first.classList.add('is-hidden');card.classList.add('is-hidden');first=null;lock=false},650)}update()};reset.onclick=init;init();</script></body></html>
