<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拖放排序</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>DRAG LAB / 054</span><b>DRAG / DROP</b></header><main class="micro-main"><p class="micro-eyebrow">GESTURE / ARRANGE</p><h1>拖动几个块，<br><em>排出你的顺序。</em></h1><p class="micro-lead">桌面端拖放和触控端点击都能改变顺序，适合体验轻量的整理动作。</p><section class="micro-panel"><div class="micro-list" id="list"><div class="micro-card" draggable="true" data-id="a"><h3>收集</h3><p>找到素材</p></div><div class="micro-card" draggable="true" data-id="b"><h3>整理</h3><p>建立结构</p></div><div class="micro-card" draggable="true" data-id="c"><h3>制作</h3><p>完成草稿</p></div><div class="micro-card" draggable="true" data-id="d"><h3>发布</h3><p>让它被看见</p></div></div><p class="micro-note" id="state">拖动卡片，或点击两张卡片交换位置</p></section></main><footer class="micro-footer"><span>基于 Drag n Drop · MIT License</span><span>拖放排序</span></footer><script>let dragged=null,selected=null;document.querySelectorAll('#list .micro-card').forEach(c=>{c.ondragstart=()=>{dragged=c};c.ondragover=e=>e.preventDefault();c.ondrop=()=>{if(dragged&&dragged!==c){c.parentNode.insertBefore(dragged,c);state.textContent='顺序已更新'}};c.onclick=()=>{if(!selected){selected=c;state.textContent='已选一张，再点击另一张交换'}else{const next=selected.nextSibling;selected.parentNode.insertBefore(selected,c.nextSibling);c.parentNode.insertBefore(c,next);selected=null;state.textContent='两张卡片已交换'}}})</script></body></html>
