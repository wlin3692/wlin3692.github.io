<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>进度步骤</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>PROGRESS LAB / 038</span><b>STEP FLOW</b></header><main class="micro-main"><p class="micro-eyebrow">FLOW / COMPLETION</p><h1>把一段流程，<br><em>走成四个清晰的点。</em></h1><p class="micro-lead">用按钮推进和回退，观察步骤状态如何给用户方向感。</p><section class="micro-panel micro-center"><div class="micro-progress"><i id="bar"></i></div><div class="micro-stat"><div><b id="step">1</b><span>当前步骤</span></div><div><b>4</b><span>全部步骤</span></div><div><b id="percent">25%</b><span>完成度</span></div></div><div class="micro-result" id="label">确定方向</div><div class="micro-row" style="justify-content:center;margin-top:18px"><button id="prev" class="micro-button secondary">上一步</button><button id="next" class="micro-button">下一步</button></div></section></main><footer class="micro-footer"><span>基于 Progress Steps · MIT License</span><span>流程状态实验</span></footer><script>const labels=['确定方向','拆分任务','完成草稿','准备发布'];let i=0;function draw(){step.textContent=i+1;percent.textContent=`${(i+1)*25}%`;bar.style.width=`${(i+1)*25}%`;label.textContent=labels[i];prev.disabled=i===0;next.textContent=i===3?'完成':'下一步'}next.onclick=()=>{i=Math.min(3,i+1);draw()};prev.onclick=()=>{i=Math.max(0,i-1);draw()};draw();</script></body></html>
