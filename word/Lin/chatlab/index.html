<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离线对话框</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>CHAT LAB / 031</span><b>LOCAL MOCKUP</b></header><main class="micro-main"><p class="micro-eyebrow">INTERFACE / CONVERSATION</p><h1>把一句话<br><em>说清楚。</em></h1><p class="micro-lead">一个无后端的聊天界面实验，用固定回应模拟信息产品里的对话节奏。</p><section class="micro-panel"><div class="micro-chat" id="chat"><div class="micro-message">你好，这里是离线对话框。试着发一句话。</div></div><div class="micro-row" style="margin-top:12px"><input id="input" class="micro-input" placeholder="输入消息"><button id="send" class="micro-button">发送</button></div></section></main><footer class="micro-footer"><span>基于 Chat Interface · MIT License</span><span>无网络请求</span></footer><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input');function send(){const text=input.value.trim();if(!text)return;chat.insertAdjacentHTML('beforeend',`<div class="micro-message me">${text.replace(/[<>]/g,'')}</div>`);input.value='';setTimeout(()=>chat.insertAdjacentHTML('beforeend','<div class="micro-message">收到。把它拆成一个更小的下一步，会更容易开始。</div>'),350);chat.scrollTop=chat.scrollHeight}send.onclick=send;input.onkeydown=e=>{if(e.key==='Enter')send()};</script></body></html>
