<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旋转导航</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>NAV LAB / 039</span><b>ROTATE MENU</b></header><main class="micro-main"><p class="micro-eyebrow">MOTION / ORIENTATION</p><h1>转一下，<br><em>换个入口。</em></h1><p class="micro-lead">模拟移动端旋转导航，用一个按钮展开四个内容入口。</p><section class="micro-panel micro-center"><div id="circle" style="width:210px;height:210px;margin:10px auto;border:1px solid var(--micro-line);border-radius:50%;display:grid;place-items:center;transition:transform .45s;background:#fff"><b id="center">作品集</b></div><div class="micro-row" style="justify-content:center"><button id="toggle" class="micro-button">打开导航</button></div><p id="status" class="micro-note">导航处于收起状态</p></section></main><footer class="micro-footer"><span>基于 Rotating Navigation · MIT License</span><span>动效练习</span></footer><script>let open=false;toggle.onclick=()=>{open=!open;circle.style.transform=`rotate(${open?90:0}deg)`;center.textContent=open?'作品 / 互动 / 关于 / 联系':'作品集';toggle.textContent=open?'收起导航':'打开导航';status.textContent=open?'四个入口已展开':'导航处于收起状态'};</script></body></html>
