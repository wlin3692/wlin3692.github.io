<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="可调节粒子密度、线条透明度和色彩的 Canvas 粒子连线实验室。">
  <title>粒子连线实验室 · 小林互动作品</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="../../../index.html#portfolio"><span class="brand-mark">N</span>小林互动作品</a><a class="back-link" href="../../../index.html#portfolio">返回作品集</a></header>
  <main class="nestlab">
    <div class="heading"><div><span class="eyebrow">CANVAS NEST / PARTICLE FIELD</span><h1>粒子连线实验室</h1></div><p>移动指针，让粒子在你的轨迹周围形成短暂的连接。</p></div>
    <section class="field" id="field"><div class="field-copy"><span>INTERACTIVE FIELD</span><strong id="fieldLabel">CALM / 080</strong><small>Canvas Nest · MIT</small></div></section>
    <section class="controls" aria-label="粒子设置">
      <label><span>粒子数量 <output id="countValue">80</output></span><input id="countInput" type="range" min="20" max="180" value="80"></label>
      <label><span>线条透明度 <output id="opacityValue">0.55</output></span><input id="opacityInput" type="range" min="20" max="90" value="55"></label>
      <label><span>主题颜色</span><select id="colorInput"><option value="83,220,202">薄荷青</option><option value="241,116,122">珊瑚红</option><option value="245,200,93">暖金</option><option value="122,160,255">电光蓝</option></select></label>
      <button id="refreshButton" type="button">重新生成</button>
    </section>
    <div class="note-line"><span>指针会吸引附近粒子</span><span>本地运行 · 无外部依赖</span></div>
  </main>
  <footer>基于 canvas-nest.js 改造 · MIT License</footer>
  <script src="canvas-nest.umd.js"></script>
  <script src="script.js"></script>
</body>
</html>
