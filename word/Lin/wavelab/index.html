<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>波形表单</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>WAVE LAB / 044</span><b>FORM MOTION</b></header><main class="micro-main"><p class="micro-eyebrow">FORM / TRANSITION</p><h1>填写表单时，<br><em>让提示更柔软。</em></h1><p class="micro-lead">输入一个称呼，观察表单下方的波纹如何随着文字长度变化。</p><section class="micro-panel"><label>你的称呼<input id="name" class="micro-input" style="width:100%;margin-top:10px" placeholder="例如：小林"></label><div id="wave" style="height:100px;margin-top:22px;overflow:hidden;background:#d9eee0;clip-path:polygon(0 45%,10% 35%,20% 52%,30% 30%,40% 56%,50% 36%,60% 55%,70% 28%,80% 58%,90% 37%,100% 50%,100% 100%,0 100%);transition:transform .25s"></div><div class="micro-result" id="greeting">等待输入</div></section></main><footer class="micro-footer"><span>基于 Form Wave Animation · MIT License</span><span>输入反馈</span></footer><script>name.oninput=()=>{const v=name.value;greeting.textContent=v?`你好，${v}。今天也给自己一点空间。`:'等待输入';wave.style.transform=`translateY(${Math.min(18,v.length*2)}px)`}</script></body></html>
