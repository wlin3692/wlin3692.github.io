<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作品终端</title><link rel="stylesheet" href="../site/microlabs.css"></head><body style="background:#101010;color:#b8f4aa"><header class="micro-top" style="border-color:#263b28"><a href="../../../index.html" style="color:#b8f4aa">← 返回作品集</a><span>TERMINAL DESK / 032</span><b>LOCAL SHELL</b></header><main class="micro-main"><p class="micro-eyebrow" style="color:#b8f4aa">COMMAND / EXPLORE</p><h1 style="color:#d9ffd2">敲一条命令，<br><em style="color:#b8f4aa">看看作品目录。</em></h1><p class="micro-lead" style="color:#7ea57b">一个终端风格的作品导航练习，不执行系统命令，只响应几个安全的本地指令。</p><section class="micro-terminal" id="terminal"><div>lin@portfolio:~$ help</div><div>可用命令：help / list / about / clear</div><div id="lines"></div><span>lin@portfolio:~$ </span><input id="cmd" autocomplete="off" autofocus></section></main><footer class="micro-footer" style="border-color:#263b28;color:#6d936a"><span>基于 Terminal Style Landing Page · MIT License</span><span>安全模拟</span></footer><script>const input=document.querySelector('#cmd'),lines=document.querySelector('#lines'),terminal=document.querySelector('#terminal');input.onkeydown=e=>{if(e.key!=='Enter')return;const cmd=input.value.trim().toLowerCase();input.value='';let out=cmd==='help'?'可用命令：help / list / about / clear':cmd==='list'?'作品：粒子实验、座位规划、专注播放、小游戏':cmd==='about'?'这是一个静态作品集终端实验。':cmd==='clear'?'':`未找到命令：${cmd}`;if(cmd==='clear'){lines.innerHTML='';return}lines.insertAdjacentHTML('beforeend',`<div>lin@portfolio:~$ ${cmd}</div><div>${out}</div>`);terminal.scrollTop=terminal.scrollHeight};</script></body></html>
