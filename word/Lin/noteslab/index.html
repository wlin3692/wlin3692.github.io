<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>便签空间</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>NOTES LAB / 018</span><b>LOCAL STORAGE</b></header><main class="micro-main"><p class="micro-eyebrow">CAPTURE / ORGANIZE</p><h1>把想法<br><em>放在这里。</em></h1><p class="micro-lead">一个克制的本地便签空间。写下临时想法，刷新页面也不会丢失。</p><section class="micro-panel"><h2>新建便签</h2><div class="micro-row"><input class="micro-input" id="note" placeholder="今天想记下什么？"><button class="micro-button" id="add">添加</button></div><ul class="micro-list" id="list"></ul></section></main><footer class="micro-footer"><span>基于 Notes App · MIT License</span><span>内容只保存在本机</span></footer><script>const input=document.querySelector('#note'),list=document.querySelector('#list');let notes=JSON.parse(localStorage.getItem('lin-notes')||'[]');function render(){list.innerHTML=notes.map((n,i)=>`<li>${n}<button data-i="${i}" aria-label="删除">删除</button></li>`).join('');localStorage.setItem('lin-notes',JSON.stringify(notes))}document.querySelector('#add').onclick=()=>{if(input.value.trim()){notes.unshift(input.value.trim());input.value='';render()}};list.onclick=e=>{if(e.target.dataset.i){notes.splice(+e.target.dataset.i,1);render()}};input.onkeydown=e=>{if(e.key==='Enter')document.querySelector('#add').click()};render();</script></body></html>
