<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参数刻度台</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>RANGE LAB / 023</span><b>CONTROL STUDY</b></header><main class="micro-main"><p class="micro-eyebrow">PARAMETER / VISUALIZE</p><h1>把数字<br><em>变成一眼可懂的形状。</em></h1><p class="micro-lead">调整四个参数，观察一个小型数据面板如何在瞬间改变。</p><section class="micro-panel"><div class="micro-row"><label style="flex:1">密度 <input id="density" class="micro-range" type="range" min="0" max="100" value="40"></label><label style="flex:1">速度 <input id="speed" class="micro-range" type="range" min="0" max="100" value="65"></label></div><div id="bars" style="height:220px;display:flex;align-items:end;gap:7px;padding:20px 0"></div><div class="micro-stat"><div><b id="d">40</b><span>密度</span></div><div><b id="s">65</b><span>速度</span></div><div><b id="sum">-</b><span>平均高度</span></div></div></section></main><footer class="micro-footer"><span>基于 Custom Range Slider · MIT License</span><span>参数可视化</span></footer><script>const bars=document.querySelector('#bars');function render(){const den=+density.value,spd=+speed.value;bars.innerHTML=Array.from({length:12},(_,i)=>`<i style="flex:1;height:${25+((den*(i+3)+spd*2)%70)}%;background:hsl(${135+i*6} 35% 40%);transition:height .2s"></i>`).join('');d.textContent=den;s.textContent=spd;sum.textContent=Math.round(25+den*.5+spd)}density.oninput=render;speed.oninput=render;render();</script></body></html>
