<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>按钮波纹</title><link rel="stylesheet" href="../site/microlabs.css"><style>.ripple{position:relative;overflow:hidden}.wave{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:wave .55s linear}@keyframes wave{to{transform:scale(4);opacity:0}}</style></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>RIPPLE LAB / 053</span><b>MICRO MOTION</b></header><main class="micro-main micro-center"><p class="micro-eyebrow">BUTTON / RESPONSE</p><h1>每一次点击，<br><em>都留下一圈波纹。</em></h1><p class="micro-lead" style="margin-left:auto;margin-right:auto">点击三个按钮，观察波纹从真实点击位置扩散出来。</p><section class="micro-panel"><div class="micro-row" style="justify-content:center"><button class="micro-button ripple">保存<span></span></button><button class="micro-button ripple">分享<span></span></button><button class="micro-button ripple">继续<span></span></button></div><p id="count" class="micro-note">点击次数 0</p></section></main><footer class="micro-footer"><span>基于 Button Ripple Effect · MIT License</span><span>点击反馈</span></footer><script>let n=0;document.querySelectorAll('.ripple').forEach(b=>b.onclick=e=>{const r=b.getBoundingClientRect(),s=document.createElement('i');s.className='wave';s.style.width=s.style.height='30px';s.style.left=`${e.clientX-r.left-15}px`;s.style.top=`${e.clientY-r.top-15}px`;b.append(s);setTimeout(()=>s.remove(),600);count.textContent=`点击次数 ${++n}`})</script></body></html>
