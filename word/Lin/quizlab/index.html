<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵感小测</title><link rel="stylesheet" href="../site/microlabs.css"></head><body><header class="micro-top"><a href="../../../index.html">← 返回作品集</a><span>QUIZ LAB / 019</span><b>3 QUESTIONS</b></header><main class="micro-main"><p class="micro-eyebrow">KNOWLEDGE / QUICK TEST</p><h1>三道题，<br><em>测测你的观察力。</em></h1><p class="micro-lead">一个不追求满分的小测验，看看你能否从细节里找到答案。</p><section class="micro-panel"><p id="progressText" class="micro-note"></p><h2 id="q"></h2><div class="micro-grid" id="answers"></div><div class="micro-result" id="result" hidden></div></section></main><footer class="micro-footer"><span>基于 Quiz App · MIT License</span><span>答完即可重来</span></footer><script>const qs=[['哪一种颜色最容易被人注意？',['荧光黄','灰色','米白','深蓝'],0],['一个网页按钮最重要的属性是什么？',['够大','可预测','闪烁','复杂'],1],['留白的作用更接近哪一个？',['浪费空间','帮助阅读','隐藏内容','增加噪音'],1]];let at=0,score=0;const q=document.querySelector('#q'),answers=document.querySelector('#answers'),result=document.querySelector('#result'),pt=document.querySelector('#progressText');function render(){if(at>=qs.length){q.textContent='小测完成';answers.innerHTML='';result.hidden=false;result.textContent=`你答对了 ${score}/${qs.length} 题。再看一遍细节，也是一种进步。`;return}const item=qs[at];pt.textContent=`QUESTION 0${at+1} / 0${qs.length}`;q.textContent=item[0];answers.innerHTML=item[1].map((a,i)=>`<button class="micro-card" data-i="${i}"><h3>${a}</h3><p>点击选择</p></button>`).join('')}answers.onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;if(+b.dataset.i===qs[at][2])score++;at++;render()};render();</script></body></html>
